; C3-Radar: 2.1" round GC9B72 (360x360) on an ESP32-C3 Super Mini or an
; ESP32-S3 SuperMini. Pins for each board are in include/config.h.
;
;   pio run -e supermini      ESP32-C3 Super Mini
;   pio run -e s3supermini    ESP32-S3 SuperMini (ESP32-S3FH4R2: 4 MB flash, 2 MB PSRAM)

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased UI fonts, one per pixel size (scripts/build_fonts.py)
board_build.embed_files =
  data/ui_font_14.vlw
  data/ui_font_16.vlw
  data/ui_font_20.vlw
  data/ui_font_22.vlw
  data/ui_font_26.vlw

; USB serial over the board's own USB-C port
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.3.0  ; first release with Panel_GC9B72
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

[env:supermini]
board = esp32-c3-devkitm-1

[env:s3supermini]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.arduino.memory_type = qio_qspi
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
