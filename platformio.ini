; ESP32-C3 Super Mini + 2.1" round GC9B72 (360×360)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased UI fonts, one per pixel size (scripts/build_fonts.py)
board_build.embed_files =
  data/ui_font_14.vlw
  data/ui_font_16.vlw
  data/ui_font_20.vlw
  data/ui_font_22.vlw
  data/ui_font_26.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.3.0  ; first release with Panel_GC9B72
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
